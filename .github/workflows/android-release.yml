name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: frontend
      - run: npm run build:web && npx cap sync android
        working-directory: frontend
      - shell: bash
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${RELEASE_VERSION#v}
        working-directory: frontend/android
      - run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/pocketcampus-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: frontend/android/app/build/outputs/apk/debug/pocketcampus-release.apk
