name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
        working-directory: frontend
      - run: npm run build:web && npx cap sync android
        working-directory: frontend
      - shell: bash
        run: |
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" app/build.gradle
          sed -i "s/versionName \"1.0.0\"/versionName \"${GITHUB_REF_NAME#v}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: frontend/android
      - run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/pocketcampus-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: frontend/android/app/build/outputs/apk/debug/pocketcampus-release.apk
